<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hello.py output</title>
  <style>
    body {
      background: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: monospace;
    }
    .terminal {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .prompt {
      color: #4ec9b0;
    }
    .command {
      color: #dcdcdc;
    }
    .output {
      color: #ce9178;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div><span class="prompt">$ </span><span class="command">python hello.py</span></div>
    <div class="output">Hello! Welcome to my AI project. Glad to have you here!</div>
  </div>
</body>
</html>
